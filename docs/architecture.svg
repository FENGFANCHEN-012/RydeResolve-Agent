<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <style>
      .t  { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .s  { font-size: 12.5px; fill: #334155; }
      .k  { font-size: 11.5px; fill: #64748b; }
      .h  { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub{ font-size: 14px; fill: #475569; }
      .llm  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .code { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; }
      .hum  { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.6; }
      .data { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; }
      .plan { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .wrap { fill: none; stroke: #2563eb; stroke-width: 1.2; stroke-dasharray: 2 3; }
      .ln  { stroke: #475569; stroke-width: 1.8; fill: none; }
      .lo  { stroke: #c2410c; stroke-width: 1.6; fill: none; }
      .lg  { stroke: #047857; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
      .lp  { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
      .lab { font-size: 11.5px; fill: #c2410c; }
      .labg{ font-size: 11.5px; fill: #047857; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="25" y="48" class="h">RydeResolve: multi-agent dispute resolution</text>
  <text x="25" y="74" class="sub">Rider and driver advocates argue the case, a Judge rules, a Fairness audit decides whether the ruling may execute or must go to a person.</text>

  <!-- Inputs -->
  <rect x="25" y="110" width="360" height="104" rx="8" class="data"/>
  <text x="41" y="136" class="t">Dispute filed</text>
  <text x="41" y="158" class="s">by the rider or the driver, free text</text>
  <text x="41" y="178" class="s">+ Ryde platform data (mock API): trip, GPS,</text>
  <text x="41" y="200" class="k">chat, payment, app events, profiles, trip policy</text>

  <!-- Policy RAG -->
  <rect x="425" y="110" width="510" height="104" rx="8" class="code"/>
  <text x="441" y="136" class="t">Policy knowledge base (RAG)</text>
  <text x="441" y="158" class="s">Ryde's official policy text, word for word (22 sources)</text>
  <text x="441" y="178" class="s">hybrid search: bge-base embeddings + BM25, Qdrant</text>
  <text x="441" y="200" class="k">sections tagged by dispute type and audience</text>

  <!-- Fraud agent (planned) -->
  <rect x="975" y="110" width="390" height="104" rx="8" class="plan"/>
  <text x="991" y="136" class="t" fill="#64748b">Fraud and bad-faith agent (planned)</text>
  <text x="991" y="158" class="s">runs beside the debate: code scores priors,</text>
  <text x="991" y="178" class="s">LLM reads chat; risk signals to Judge + Fairness</text>

  <!-- Main pipeline boxes -->
  <rect x="25" y="290" width="160" height="200" rx="8" class="code"/>
  <text x="39" y="318" class="t">1  Collector</text>
  <text x="39" y="344" class="s">Tools over GPS, fare,</text>
  <text x="39" y="362" class="s">chat, app events,</text>
  <text x="39" y="380" class="s">profiles</text>
  <text x="39" y="406" class="s">→ facts, conflicts,</text>
  <text x="39" y="424" class="s">data gaps, each with</text>
  <text x="39" y="442" class="s">its source</text>

  <rect x="225" y="290" width="160" height="200" rx="8" class="llm"/>
  <text x="239" y="318" class="t">2  Classifier</text>
  <text x="239" y="344" class="s">Dispute type</text>
  <text x="239" y="362" class="s">Urgency P0–P3</text>
  <text x="239" y="388" class="s">Safety (P0) and</text>
  <text x="239" y="406" class="s">unclear cases go</text>
  <text x="239" y="424" class="s">straight to a person</text>

  <rect x="425" y="290" width="170" height="200" rx="8" class="code"/>
  <text x="439" y="318" class="t">3  Case Brief</text>
  <text x="439" y="344" class="s">One shared dossier:</text>
  <text x="439" y="362" class="s">facts, conflicts,</text>
  <text x="439" y="380" class="s">trip rules, timeline,</text>
  <text x="439" y="398" class="s">policy clauses</text>
  <text x="439" y="424" class="k">no LLM: computed</text>
  <text x="439" y="440" class="k">from platform data</text>

  <!-- Debate container -->
  <rect x="635" y="262" width="300" height="256" rx="10" class="wrap"/>
  <text x="651" y="286" class="t">4  Adversarial debate</text>
  <rect x="651" y="300" width="268" height="58" rx="7" class="llm"/>
  <text x="665" y="324" class="t" font-size="14">Rider advocate</text>
  <text x="665" y="344" class="s">opening case + rebuttal, cites policy</text>
  <rect x="651" y="368" width="268" height="58" rx="7" class="llm"/>
  <text x="665" y="392" class="t" font-size="14">Driver advocate</text>
  <text x="665" y="412" class="s">opening defence + rebuttal, cites policy</text>
  <rect x="651" y="436" width="268" height="58" rx="7" class="llm"/>
  <text x="665" y="460" class="t" font-size="14">Policy agent</text>
  <text x="665" y="480" class="s">compliance check against the clauses</text>
  <text x="651" y="511" class="k">advocates may request more policy topics</text>

  <rect x="975" y="290" width="170" height="200" rx="8" class="llm"/>
  <text x="989" y="318" class="t">5  Judge</text>
  <text x="989" y="344" class="s">Splits the filing</text>
  <text x="989" y="362" class="s">into asks, rules on</text>
  <text x="989" y="380" class="s">each; every amount</text>
  <text x="989" y="398" class="s">from a specific rule</text>
  <text x="989" y="424" class="s">→ verdict, refund,</text>
  <text x="989" y="442" class="s">confidence, reasons</text>

  <rect x="1185" y="290" width="180" height="200" rx="8" class="code"/>
  <text x="1199" y="318" class="t">6  Fairness audit</text>
  <text x="1199" y="344" class="s">Checks in code:</text>
  <text x="1199" y="362" class="s">citations are real,</text>
  <text x="1199" y="380" class="s">GPS gaps, fee basis,</text>
  <text x="1199" y="398" class="s">refund has a rule</text>
  <text x="1199" y="420" class="s">+ LLM review of</text>
  <text x="1199" y="438" class="s">grounding and bias</text>

  <rect x="1405" y="290" width="170" height="200" rx="8" class="code"/>
  <text x="1419" y="318" class="t">7  Executor</text>
  <text x="1419" y="344" class="s">Refund / penalty</text>
  <text x="1419" y="362" class="s">(simulated)</text>
  <text x="1419" y="388" class="s">A notice to each</text>
  <text x="1419" y="406" class="s">party with its own</text>
  <text x="1419" y="424" class="s">outcome</text>
  <text x="1419" y="446" class="k">EN · 中文 · BM · தமிழ்</text>

  <!-- Main flow arrows -->
  <line x1="105" y1="214" x2="105" y2="288" class="ln" marker-end="url(#a)"/>
  <line x1="185" y1="390" x2="223" y2="390" class="ln" marker-end="url(#a)"/>
  <line x1="385" y1="390" x2="423" y2="390" class="ln" marker-end="url(#a)"/>
  <line x1="595" y1="390" x2="633" y2="390" class="ln" marker-end="url(#a)"/>
  <line x1="935" y1="390" x2="973" y2="390" class="ln" marker-end="url(#a)"/>
  <line x1="1145" y1="390" x2="1183" y2="390" class="ln" marker-end="url(#a)"/>
  <line x1="1365" y1="390" x2="1403" y2="390" class="ln" marker-end="url(#a)"/>

  <!-- RAG feeds -->
  <line x1="510" y1="214" x2="510" y2="288" class="ln" marker-end="url(#a)"/>
  <line x1="785" y1="214" x2="785" y2="260" class="ln" marker-end="url(#a)"/>

  <!-- Fraud (planned) feeds -->
  <line x1="1060" y1="214" x2="1060" y2="288" class="lp" marker-end="url(#a)"/>
  <line x1="1275" y1="214" x2="1275" y2="288" class="lp" marker-end="url(#a)"/>

  <!-- Human review and learning loop -->
  <rect x="225" y="620" width="710" height="110" rx="8" class="hum"/>
  <text x="241" y="648" class="t">Human review queue</text>
  <text x="241" y="672" class="s">Gets every case the system should not decide alone: safety (P0), unclear type, a node error,</text>
  <text x="241" y="692" class="s">a deciding fact nobody can verify (GPS gap), a fee or refund the platform data contradicts,</text>
  <text x="241" y="712" class="s">and refunds that only Ryde's discretion could set. The reviewer sees the full case and audit trail.</text>

  <rect x="975" y="620" width="390" height="110" rx="8" class="code"/>
  <text x="991" y="648" class="t">Precedents (learning loop)</text>
  <text x="991" y="672" class="s">Reviewer corrections become precedents,</text>
  <text x="991" y="692" class="s">released only after approval and a pass</text>
  <text x="991" y="712" class="s">of the evaluation gate</text>

  <rect x="1405" y="620" width="170" height="110" rx="8" class="data"/>
  <text x="1419" y="648" class="t">Resolved</text>
  <text x="1419" y="672" class="s">Ruling, action and</text>
  <text x="1419" y="692" class="s">explanation sent to</text>
  <text x="1419" y="712" class="s">rider and driver</text>

  <!-- escalation arrows -->
  <path d="M305,490 L305,618" class="lo" marker-end="url(#ao)"/>
  <text x="312" y="560" class="lab">P0 / unclear</text>
  <path d="M1275,490 L1275,560 L880,560 L880,618" class="lo" marker-end="url(#ao)"/>
  <text x="1092" y="553" class="lab">escalate (any high-severity finding)</text>
  <path d="M1490,490 L1490,618" class="ln" marker-end="url(#a)"/>

  <!-- learning loop arrows -->
  <line x1="935" y1="675" x2="973" y2="675" class="lg" marker-end="url(#ag)"/>
  <path d="M1060,620 L1060,492" class="lg" marker-end="url(#ag)"/>
  <text x="1068" y="596" class="labg">similar past rulings</text>

  <!-- Footer: legend and stack -->
  <line x1="25" y1="770" x2="1575" y2="770" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="25" y="792" width="18" height="14" rx="3" class="llm"/>
  <text x="51" y="804" class="s">LLM agent</text>
  <rect x="150" y="792" width="18" height="14" rx="3" class="code"/>
  <text x="176" y="804" class="s">Deterministic code (no LLM)</text>
  <rect x="380" y="792" width="18" height="14" rx="3" class="hum"/>
  <text x="406" y="804" class="s">Human</text>
  <rect x="475" y="792" width="18" height="14" rx="3" class="plan"/>
  <text x="501" y="804" class="s">Planned</text>
  <line x1="590" y1="799" x2="630" y2="799" class="lo" marker-end="url(#ao)"/>
  <text x="638" y="804" class="s">to a person</text>

  <text x="25" y="838" class="s">Orchestration: LangGraph (every node fails safe to human review) · LLM: gpt-oss-120b (Cerebras or Groq) · Backend: FastAPI · Vector store: Qdrant</text>
  <text x="25" y="860" class="s">Observable: every agent's input, output and LLM call is streamed live to the dashboard as an inter-agent trace.</text>
  <text x="25" y="882" class="s">Evaluated offline: 33 answer-keyed cases (dev + held-out variants: paraphrase, counterfactual, prompt injection) + a sealed set written by another model.</text>
</svg>
