<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1292.0" viewBox="0 0 760 1292.0" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #b8b8b0; stroke-width: 1.3; }
      .end { fill: #e6edf9; stroke: #2f6fd6; stroke-width: 2.2; }
      .gate { fill: #fff; stroke: #b8b8b0; stroke-width: 1.3; }
      .ln { stroke: #b0b0a8; stroke-width: 1.3; fill: none; }
      .t { font-size: 15px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
      .s { font-size: 12px; fill: #5b6068; text-anchor: middle; }
      .g { font-size: 13.5px; fill: #1f2328; text-anchor: middle; }
      .lbl { font-size: 12.5px; fill: #5b6068; }
      .h { font-size: 16px; font-weight: 600; fill: #1f2328; }
    </style>
  </defs>
  <rect width="760" height="1292.0" fill="#fff"/>
  <text x="24" y="40" class="h">Money moves only when the Judge, code checks, the policy gate and fairness all agree</text>
    <rect x="60.0" y="90" width="340" height="60" rx="9" class="box"/>
  <text x="230" y="115" class="t">Dispute filed</text>
  <text x="230" y="135" class="s">by the rider or the driver, in the app</text>
  <line x1="230" y1="150" x2="230" y2="174" class="ln" marker-end="url(#a)"/>
  <rect x="60.0" y="176" width="340" height="60" rx="9" class="box"/>
  <text x="230" y="201" class="t">Collect evidence</text>
  <text x="230" y="221" class="s">trip, GPS, chat, app events, photos; checked in code</text>
  <line x1="230" y1="236" x2="230" y2="260" class="ln" marker-end="url(#a)"/>
  <rect x="60.0" y="262" width="340" height="60" rx="9" class="box"/>
  <text x="230" y="287" class="t">Classify and triage</text>
  <text x="230" y="307" class="s">dispute type, urgency P0 to P3</text>
  <line x1="230" y1="322" x2="230" y2="346" class="ln" marker-end="url(#a)"/>
  <polygon points="230,348 380.0,394.0 230,440 80.0,394.0" class="gate"/>
  <text x="230" y="399.0" class="g">Safety or legal (P0)?</text>
  <text x="244" y="458" class="lbl" text-anchor="start">no</text>
  <line x1="230" y1="440" x2="230" y2="464" class="ln" marker-end="url(#a)"/>
  <rect x="60.0" y="466" width="340" height="60" rx="9" class="box"/>
  <text x="230" y="491" class="t">Case brief and risk check</text>
  <text x="230" y="511" class="s">v2.1 sections for this dispute; fraud report to Judge only</text>
  <line x1="230" y1="526" x2="230" y2="550" class="ln" marker-end="url(#a)"/>
  <rect x="60.0" y="552" width="340" height="60" rx="9" class="box"/>
  <text x="230" y="577" class="t">Advocates argue both sides</text>
  <text x="230" y="597" class="s">rider vs driver, each from the records and the policy</text>
  <line x1="230" y1="612" x2="230" y2="636" class="ln" marker-end="url(#a)"/>
  <rect x="60.0" y="638" width="340" height="60" rx="9" class="box"/>
  <text x="230" y="663" class="t">Judge rules</text>
  <text x="230" y="683" class="s">verdict, amount, confidence, cited v2.1 sections</text>
  <line x1="230" y1="698" x2="230" y2="722" class="ln" marker-end="url(#a)"/>
  <polygon points="230,724 380.0,770.0 230,816 80.0,770.0" class="gate"/>
  <text x="230" y="765.0" class="g">Code Judge: facts on the</text>
  <text x="230" y="785.0" class="g">records, amount adds up?</text>
  <text x="244" y="834" class="lbl" text-anchor="start">yes</text>
  <line x1="230" y1="816" x2="230" y2="840" class="ln" marker-end="url(#a)"/>
  <polygon points="230,842 380.0,888.0 230,934 80.0,888.0" class="gate"/>
  <text x="230" y="883.0" class="g">Policy v2.1 gate:</text>
  <text x="230" y="903.0" class="g">may an AI decide this?</text>
  <text x="244" y="952" class="lbl" text-anchor="start">yes</text>
  <line x1="230" y1="934" x2="230" y2="958" class="ln" marker-end="url(#a)"/>
  <rect x="60.0" y="960" width="340" height="60" rx="9" class="box"/>
  <text x="230" y="985" class="t">Fairness audit</text>
  <text x="230" y="1005" class="s">both sides heard? citations real? consistent?</text>
  <line x1="230" y1="1020" x2="230" y2="1044" class="ln" marker-end="url(#a)"/>
  <polygon points="230,1046 380.0,1092.0 230,1138 80.0,1092.0" class="gate"/>
  <text x="230" y="1097.0" class="g">Fairness clears it?</text>
  <text x="244" y="1156" class="lbl" text-anchor="start">yes</text>
  <line x1="230" y1="1138" x2="230" y2="1162" class="ln" marker-end="url(#a)"/>
  <rect x="60.0" y="1164" width="340" height="60" rx="9" class="end"/>
  <text x="230" y="1189" class="t">Resolved automatically</text>
  <text x="230" y="1209" class="s">refund or fee applied, both parties notified</text>
  <rect x="530" y="1132.0" width="220" height="130" rx="9" class="box"/>
  <text x="640" y="1160.0" class="t">A person decides</text>
  <text x="640" y="1186.0" class="s">review desk: evidence, both</text>
  <text x="640" y="1206.0" class="s">arguments, the draft ruling</text>
  <text x="640" y="1226.0" class="s">and why it was stopped;</text>
  <text x="640" y="1246.0" class="s">Tencent ADP answers policy Qs</text>
  <line x1="380.0" y1="394.0" x2="640" y2="394.0" class="ln"/>
  <text x="390.0" y="387.0" class="lbl" text-anchor="start">yes</text>
  <line x1="380.0" y1="770.0" x2="640" y2="770.0" class="ln"/>
  <text x="390.0" y="763.0" class="lbl" text-anchor="start">no (after one redraft)</text>
  <line x1="380.0" y1="888.0" x2="640" y2="888.0" class="ln"/>
  <text x="390.0" y="881.0" class="lbl" text-anchor="start">no</text>
  <line x1="380.0" y1="1092.0" x2="640" y2="1092.0" class="ln"/>
  <text x="390.0" y="1085.0" class="lbl" text-anchor="start">no</text>
  <line x1="640" y1="394.0" x2="640" y2="1130.0" class="ln" marker-end="url(#a)"/>
</svg>
