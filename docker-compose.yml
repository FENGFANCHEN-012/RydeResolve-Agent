services:
  # --- API Server ---
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - TENCENT_SECRET_ID=${TENCENT_SECRET_ID:-}
      - TENCENT_SECRET_KEY=${TENCENT_SECRET_KEY:-}
      - TENCENT_REGION=${TENCENT_REGION:-ap-singapore}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.6-flash}
      - STORE_URL=${STORE_URL:-postgresql://postgres:postgres@db:5432/ryde_resolve}
      - VECTOR_BACKEND=${VECTOR_BACKEND:-chroma}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ryde_resolve
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    volumes:
      - apirecords:/app/data/records
      - apiuploads:/app/data/uploads
      - apievidence:/app/data/evidence
      - chromalocal:/app/chroma_data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      chromadb:
        condition: service_started
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000

  # --- PostgreSQL ---
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ryde_resolve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  # --- ChromaDB (Vector Store for RAG) ---
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "127.0.0.1:8200:8000"
    volumes:
      - chromadata:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma

volumes:
  apirecords:
  apiuploads:
  apievidence:
  chromalocal:
  pgdata:
  redisdata:
  chromadata:
